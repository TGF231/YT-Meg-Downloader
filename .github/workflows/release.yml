name: Release

on:
  push:
    tags: ["v*"]
  # Permite publicar sem enviar a tag: o gh cria a tag no commit escolhido.
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar, com o v (ex.: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sem estas bibliotecas o import do PySide6 falha e os testes de
      # interface são pulados em silêncio, que é pior do que falhar.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg
      # Instala as dependências declaradas, não uma lista à parte: uma lista
      # fixa aqui já divergiu do requirements.txt duas vezes e derrubou o CI.
      - run: pip install -r requirements.txt pyflakes
      - name: Confere que nenhum teste importante será pulado
        run: |
          python -c "import PySide6.QtWidgets; print('PySide6 importa: ok')"
          ffmpeg -version | head -1
      - run: python -m pyflakes pen_drive_maker main.py tests scripts
      - run: python -m unittest discover -s tests -v

  dists:
    name: Wheel e sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/*

  binaries:
    name: Executável (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc antiga = binário compatível com mais distribuições.
          - os: ubuntu-22.04
            label: linux-x86_64
            tools: linux
            artifact: PenDriveMaker
            output: PenDriveMaker-linux-x86_64
          - os: windows-latest
            label: windows-x86_64
            tools: windows
            artifact: PenDriveMaker.exe
            output: PenDriveMaker-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      # Embute ffmpeg e deno: o executável passa a não depender de nada
      # instalado na máquina. O script exporta PDM_BUNDLE_DIR.
      - run: python scripts/fetch_tools.py ${{ matrix.tools }} vendor
      - run: pyinstaller --noconfirm packaging.spec
      - name: Renomeia o artefato
        shell: bash
        run: mv "dist/${{ matrix.artifact }}" "dist/${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.label }}
          path: dist/${{ matrix.output }}
      - name: Publica as licenças das ferramentas embutidas
        if: matrix.label == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: licencas
          path: vendor/THIRD-PARTY-LICENSES.txt

  release:
    name: Publica a release
    needs: [dists, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve a versão
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Monta as notas a partir do CHANGELOG
        id: notes
        run: |
          version="${{ steps.version.outputs.tag }}"
          version="${version#v}"
          # Recorta a seção da versão no CHANGELOG; se não achar, o gh gera as notas.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then echo "has_notes=true" >> "$GITHUB_OUTPUT"; fi
      - name: Cria a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          ls -la artifacts
          tag="${{ steps.version.outputs.tag }}"
          # --target cria a tag neste commit quando ela ainda não existe.
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            gh release create "$tag" artifacts/* --target "$GITHUB_SHA" \
              --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" artifacts/* --target "$GITHUB_SHA" \
              --title "$tag" --generate-notes
          fi
